# Quiet Dependabot: one grouped PR per app per month, minor/patch only.
# Major upgrades (TypeScript, Next, motion, lucide, NestJS, Prisma…) are done by hand.
version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(api)"
    groups:
      api-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x packages: a "minor" bump can be breaking — upgrade by hand
      - dependency-name: "class-validator"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "class-transformer"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(web)"
    groups:
      web-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
